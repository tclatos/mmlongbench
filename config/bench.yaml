# MMLongBench evaluation configuration.
# Select active profile via CLI `--profile <name>` (defaults to `default_profile`).
# Outcome paths write under a dedicated directory per bench profile.

default_profile: default
dataset_adapter: mmlongbench.adapter.MMLongBenchAdapter

# Shared outcome paths across all bench profiles
paths:
  runs: ${paths.data_root}/mmlongbench/{profile}/runs.jsonl
  scores: ${paths.data_root}/mmlongbench/{profile}/scores.jsonl
  scores_summary: ${paths.data_root}/mmlongbench/{profile}/scores_summary.json

bench_profiles:
  default:
    description: "GLM 5.3 Flash multimodal deep agent with DeepSeek V4 grader on MMLongBench-Doc"
    docgraph_profile: default
    agent_profile: default

    files:
      pathspecs:
        - "*"
      docs: []
      limit: null

    runner:
      concurrency: 8
      folder_id: null
      monitoring: null

    grader:
      enabled: true
      llm: deepSeek-V4.1-Flash@openrouter
      concurrency: 8

