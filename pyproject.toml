[project]
name = "mmlongbench"
version = "0.1.0"
description = "Benchmarking a Document Graph + deep agent stack on MMLongBench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genai-graph",
    "genai-tk",
    "datasets>=2.20",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pillow>=10.0",
]

[tool.uv.sources]
genai-tk = { git = "https://github.com/tclatos/genai-tk", rev = "main" }
genai-graph = { path = "../genai-graph", editable = true }

[tool.uv]
package = true


# Forward genai-tk optional extras — install with: uv sync --extra <name>
[project.optional-dependencies]
harnessing = ["genai-tk[harnessing]"]
browser    = ["genai-tk[browser]"]
nlp        = ["genai-tk[nlp]"]
postgres   = ["genai-tk[postgres]"]
streamlit  = ["genai-tk[streamlit]"]
baml       = ["genai-tk[baml]", "baml-py"]  # baml-py must be direct to expose baml-cli binary
chromadb   = ["genai-tk[chromadb]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmlongbench"]
